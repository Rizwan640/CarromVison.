
name: CarromVision Android APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'CarromVision_AndroidStudio_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip -q CarromVision_AndroidStudio_Project.zip -d project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        run: |
          cd project/CarromVision
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarromVision-APK
          path: project/CarromVision/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
